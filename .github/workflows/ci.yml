name: CI

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    name: Server (relayer)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: subly_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          # package-lock.json is generated by npm 11; Node 24 ships it (same pin as the Dockerfile).
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
        env:
          SUBLY_TEST_POSTGRES_URL: postgres://postgres:test-only@127.0.0.1:5432/subly_test
          SUBLY_TEST_BACKUP_COMPOSE: '1'
      - run: npm run build
      - run: npm run docs:check
      - run: node scripts/audit-relayer.mjs

  client:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Preserve the existing required branch-protection check name.
          - os: ubuntu-latest
            name: Client (@subly_fi/pay)
          - os: macos-latest
            name: Client (macOS)
          - os: windows-latest
            name: Client (Windows)
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/pay/package-lock.json
      # packages/pay/src imports the repo root src/, so root deps are needed too.
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts
        working-directory: packages/pay
      - run: npm run typecheck
        working-directory: packages/pay
      - run: npm run build
        working-directory: packages/pay
      - run: npm run pack:check
        working-directory: packages/pay
      - run: npm run test:package
      - run: node scripts/audit-client.mjs

  browser:
    name: Owner browser flows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser

  container:
    name: Relayer container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: docker build -t subly-test .
      - name: Smoke test detached container
        run: |
          docker run -d --name subly-test --read-only --tmpfs /tmp -e NODE_ENV=development -p 127.0.0.1:3000:3000 subly-test
          for i in $(seq 1 30); do
            if curl --fail --max-time 5 http://127.0.0.1:3000/readyz; then break; fi
            sleep 2
          done
          # A responding catalogue does not establish readiness after the loop expires.
          curl --fail --max-time 5 http://127.0.0.1:3000/readyz
          curl --fail --max-time 5 http://127.0.0.1:3000/v1/vaults
          test "$(docker exec subly-test id -u)" = 1000
          docker stop --time 15 subly-test
          test "$(docker inspect --format='{{.State.ExitCode}}' subly-test)" = 0
      - if: failure()
        run: docker logs subly-test || true
