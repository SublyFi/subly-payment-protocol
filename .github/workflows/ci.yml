name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    name: Server (relayer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # package-lock.json is generated by npm 11; Node 24 ships it (same pin as the Dockerfile).
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  client:
    name: Client (@subly_fi/pay)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/pay/package-lock.json
      # packages/pay/src imports the repo root src/, so root deps are needed too.
      - run: npm ci
      - run: npm ci
        working-directory: packages/pay
      - run: npm run typecheck
        working-directory: packages/pay
      - run: npm run build
        working-directory: packages/pay
      - run: npm run pack:check
        working-directory: packages/pay
      - run: npm audit --omit=dev --audit-level=high
        working-directory: packages/pay
