name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    name: Server (relayer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          # package-lock.json is generated by npm 11; Node 24 ships it (same pin as the Dockerfile).
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  client:
    name: Client (@subly_fi/pay)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/pay/package-lock.json
      # packages/pay/src imports the repo root src/, so root deps are needed too.
      - run: npm ci
      - run: npm ci
        working-directory: packages/pay
      - run: npm run typecheck
        working-directory: packages/pay
      - run: npm run build
        working-directory: packages/pay
      - run: npm run pack:check
        working-directory: packages/pay
      - run: npm audit --omit=dev --audit-level=high
        working-directory: packages/pay
