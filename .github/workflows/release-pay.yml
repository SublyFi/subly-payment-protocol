name: Release @subly_fi/pay

on:
  push:
    tags:
      - "pay-v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: verify
    name: Publish client package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/pay/package-lock.json
      - run: npm ci --ignore-scripts
      # The package build inlines shared demo/src code from the repository.
      - run: npm ci --ignore-scripts
        working-directory: packages/pay
      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e 'const expected = `pay-v${require("./package.json").version}`; if (process.env.RELEASE_TAG !== expected) { throw new Error(`Expected ${expected}, got ${process.env.RELEASE_TAG}`); }'
        working-directory: packages/pay
      - run: npm run typecheck
        working-directory: packages/pay
      - run: npm run build
        working-directory: packages/pay
      - run: npm pack --dry-run --json
        working-directory: packages/pay
      - name: Check whether this exact commit was already published
        id: registry
        env:
          RELEASE_COMMIT: ${{ github.sha }}
        run: node scripts/verify-published-package.mjs --check-publish-state --require-provenance
      - run: npm publish --access public --provenance
        if: steps.registry.outputs.published != 'true'
        working-directory: packages/pay
      - name: Verify exact registry version, provenance metadata, installation, CLI and MCP
        env:
          RELEASE_COMMIT: ${{ github.sha }}
        run: node scripts/verify-published-package.mjs --require-provenance

  release:
    needs: publish
    name: Create verified GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release only after registry installation succeeds
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists for $RELEASE_TAG."
          else
            gh release create "$RELEASE_TAG" --verify-tag --title "Subly ${RELEASE_TAG#pay-v}" --generate-notes
          fi
