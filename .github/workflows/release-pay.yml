name: Release @subly_fi/pay

on:
  # Manual runs verify npm trust without publishing a new package version.
  workflow_dispatch:
  push:
    tags:
      - "pay-v*"

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml
  verify-trust:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    name: Verify npm trusted publisher (no publish)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          package-manager-cache: false
      - run: node scripts/verify-npm-trust.mjs
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/pay-v')
    needs: verify
    name: Publish client package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/pay/package-lock.json
      - run: npm ci --ignore-scripts
      # The package build inlines shared demo/src code from the repository.
      - run: npm ci --ignore-scripts
        working-directory: packages/pay
      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e 'const expected = `pay-v${require("./package.json").version}`; if (process.env.RELEASE_TAG !== expected) { throw new Error(`Expected ${expected}, got ${process.env.RELEASE_TAG}`); }'
        working-directory: packages/pay
      - run: npm run typecheck
        working-directory: packages/pay
      - run: npm run build
        working-directory: packages/pay
      - run: npm pack --dry-run --json
        working-directory: packages/pay
      - run: npm publish --access public --provenance
        working-directory: packages/pay
