name: Release @subly_fi/pay

on:
  push:
    tags:
      - "pay-v*"

permissions:
  contents: read

jobs:
  publish:
    name: Publish client package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/pay/package-lock.json
      - run: npm ci
      # The package build inlines shared demo/src code from the repository.
      - run: npm ci
        working-directory: packages/pay
      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: test "$RELEASE_TAG" = "pay-v$(node -p \"require('./package.json').version\")"
        working-directory: packages/pay
      - run: npm run typecheck
        working-directory: packages/pay
      - run: npm run build
        working-directory: packages/pay
      - run: npm pack --dry-run --json
        working-directory: packages/pay
      - run: npm publish --access public --provenance
        working-directory: packages/pay
