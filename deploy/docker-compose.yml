# Subly relayer deployment: the buyer-side vault/budget/yield-realize API
# (sponsored fees) + Postgres ledger, fronted by Caddy (automatic HTTPS).
# The relayer is NOT an x402 facilitator — sellers bring their own
# (e.g. PayAI, Coinbase CDP); this service only prepares/co-signs sponsored
# vault flows and enforces the yield-only budget. Run from deploy/:
#
# Follow deploy/README.md for first-time file creation without overwrites,
# sponsor-key copy (UID 1000, mode 600), configuration checks, and startup.
# Keep the existing .env, keys, and database volume on retries/upgrades.
# Never regenerate POSTGRES_PASSWORD for an existing database as a retry.
#
# Secrets (env files, secrets/, Caddyfile) stay on the host; nothing is baked
# into the image. The retired subly-yield-exact seller endpoints stay off
# unless SUBLY_ENABLE_LEGACY_X402=1 is set in the relayer env.
services:
  postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in deploy/.env}
      POSTGRES_DB: subly
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  relayer:
    build: ..
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 60s
    restart: unless-stopped
    env_file: relayer.production.env
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/subly
      SUBLY_SPONSOR_KEYPAIR_PATH: /run/subly/sponsor.json
    volumes:
      - ./secrets/sponsor.json:/run/subly/sponsor.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3000"

  caddy:
    image: caddy:2@sha256:df7f1c2fb114453b951de51a98efc010db1655a92c2e86be6706714e2417a78d
    restart: unless-stopped
    ports:
      - "${SUBLY_BIND_ADDRESS:+${SUBLY_BIND_ADDRESS}:}80:80"
      - "${SUBLY_BIND_ADDRESS:+${SUBLY_BIND_ADDRESS}:}443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      relayer:
        condition: service_healthy

volumes:
  pgdata:
  caddy_data:
  caddy_config:
