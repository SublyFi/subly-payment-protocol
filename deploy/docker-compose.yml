# Subly relayer deployment: the buyer-side vault/budget/yield-realize API
# (sponsored fees) + Postgres ledger, fronted by Caddy (automatic HTTPS).
# The relayer is NOT an x402 facilitator — sellers bring their own
# (e.g. PayAI, Coinbase CDP); this service only prepares/co-signs sponsored
# vault flows and enforces the yield-only budget. Run from deploy/:
#
#   1. cp relayer.production.env.example relayer.production.env  (fill in)
#   2. cp Caddyfile.example Caddyfile                            (set domain)
#   3. mkdir -p secrets && put the sponsor keypair at secrets/sponsor.json
#   4. echo "POSTGRES_PASSWORD=<strong-random>" > .env
#   5. docker compose up -d --build
#
# Secrets (env files, secrets/, Caddyfile) stay on the host; nothing is baked
# into the image. The retired subly-yield-exact seller endpoints stay off
# unless SUBLY_ENABLE_LEGACY_X402=1 is set in the relayer env.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in deploy/.env}
      POSTGRES_DB: subly
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  relayer:
    build: ..
    restart: unless-stopped
    env_file: relayer.production.env
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/subly
      SUBLY_SPONSOR_KEYPAIR_PATH: /run/subly/sponsor.json
    volumes:
      - ./secrets/sponsor.json:/run/subly/sponsor.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - relayer

volumes:
  pgdata:
  caddy_data:
  caddy_config:
